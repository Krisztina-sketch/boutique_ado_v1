{% extends "base.html" %}

{% block content %}

<h1>Products</h1>

<div class="container">
    <div class="row">

        {% for product in products %}

        <div class="col-md-4">

            <div class="card mb-4">

                <a href="{% url 'product_detail' product.id %}">
                    <img src="{{ product.image.url }}" 
                         class="card-img-top" 
                         alt="{{ product.name }}">
                </a>

                <div class="card-body">

                    <h5 class="card-title">
                        {{ product.name }}
                    </h5>

                    <p class="card-text">
                        {{ product.description }}
                    </p>

                    <p>
                        £{{ product.price }}
                    </p>

                    <a href="{% url 'product_detail' product.id %}" 
                       class="btn btn-dark">
                        View Product
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>
</div>

{% endblock %}
