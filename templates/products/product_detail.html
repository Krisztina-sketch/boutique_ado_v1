{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="row">

        <div class="col-md-6">
            <img src="{{ product.image.url }}" 
                 class="img-fluid" 
                 alt="{{ product.name }}">
        </div>

        <div class="col-md-6">
            <h1>{{ product.name }}</h1>

            <p>{{ product.description }}</p>

            <h3>£{{ product.price }}</h3>
            <a href="{% url 'products' %}" class="btn btn-dark mt-4">
    Back to Products

        </div>

    </div>
</div>

{% endblock %}
